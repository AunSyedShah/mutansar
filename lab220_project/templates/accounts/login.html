{% extends 'base.html' %}

{% block title %}Sign In | MultiMarket{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
        <div class="text-center">
            <div class="w-12 h-12 bg-brand-50 text-brand-600 rounded-xl flex items-center justify-center mx-auto mb-3">
                <i class="fa-solid fa-lock text-xl"></i>
            </div>
            <h2 class="text-2xl font-bold tracking-tight text-slate-900">Sign in to your account</h2>
            <p class="mt-2 text-xs text-slate-500">Access your orders, favorites, or vendor storefront</p>
        </div>

        <form class="mt-8 space-y-5" method="POST" action="{% url 'accounts:login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
            {% csrf_token %}

            <div>
                <label for="id_username" class="block text-xs font-semibold text-slate-700 mb-1">Username</label>
                <input type="text" name="username" id="id_username" required
                       class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none"
                       placeholder="Enter your username">
            </div>

            <div>
                <label for="id_password" class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
                <input type="password" name="password" id="id_password" required
                       class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none"
                       placeholder="••••••••">
            </div>

            <div>
                <button type="submit" class="w-full py-2.5 px-4 bg-brand-600 hover:bg-brand-700 text-white font-medium text-sm rounded-lg transition shadow-xs focus:ring-2 focus:ring-brand-500 focus:ring-offset-2">
                    Sign In
                </button>
            </div>
        </form>

        <div class="border-t border-slate-100 pt-6 text-center text-xs space-y-2">
            <p class="text-slate-500">New customer? <a href="{% url 'accounts:register_buyer' %}" class="font-semibold text-brand-600 hover:text-brand-500">Create a buyer account</a></p>
            <p class="text-slate-500">Want to sell? <a href="{% url 'accounts:register_vendor' %}" class="font-semibold text-brand-600 hover:text-brand-500">Register as a vendor</a></p>
        </div>
    </div>
</div>
{% endblock %}
